<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="t d">
  <title id="t">Yu-Ting Pan</title>
  <desc id="d">Software engineer, Go and Python. AI tooling, verification, real-time backends.</desc>
  <defs>
    <radialGradient id="glow" cx="22%" cy="55%" r="75%">
      <stop offset="0" stop-color="#1a2028"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </radialGradient>
    <style>
      .name { font: 700 104px "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: -3px; fill: #f2f4f6; }
      .role { font: 400 30px "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #c9d1d9; }
      .go { fill: #00ADD8; font-weight: 600; }
      .mono { font: 400 15px "SFMono-Regular", Consolas, "Liberation Mono", monospace; letter-spacing: 3px; fill: #8b949e; }
      .rise { opacity: 0; animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) forwards; }
      .d1 { animation-delay: .2s; }
      .d2 { animation-delay: .7s; }
      .d3 { animation-delay: 1.1s; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      .draw { stroke-dasharray: 180; stroke-dashoffset: 180; animation: draw 1.2s .9s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .rise { animation: none; opacity: 1; }
        .draw { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="500" fill="url(#glow)"/>

  <!-- letterbox bars -->
  <rect width="1200" height="48" fill="#000"/>
  <rect y="452" width="1200" height="48" fill="#000"/>
  <text class="mono" x="72" y="30">README.md</text>
  <text class="mono" x="72" y="482">SOFTWARE ENGINEER</text>
  <text class="mono" x="1128" y="482" text-anchor="end">TAIWAN</text>

  <!-- focal event: the name -->
  <text class="name rise d1" x="72" y="250">Yu-Ting Pan</text>
  <text class="role rise d2" x="72" y="306">Software engineer, <tspan class="go">Go</tspan> &amp; Python</text>

  <!-- horizon: the quiet right side is the release zone -->
  <line x1="72" y1="346" x2="1128" y2="346" stroke="#2a2f36" stroke-width="1"/>
  <line class="draw" x1="72" y1="346" x2="252" y2="346" stroke="#00ADD8" stroke-width="2"/>
  <text class="mono rise d3" x="72" y="392">AI TOOLING  /  VERIFICATION  /  REAL-TIME BACKENDS</text>
</svg>
